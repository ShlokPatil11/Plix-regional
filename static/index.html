<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Directory Language Studio</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background:#11151b; color:#eef2f7 }
    body { max-width:850px; margin:48px auto; padding:0 20px }
    main { background:#1b222c; border:1px solid #303b49; border-radius:16px; padding:28px }
    h1 { margin:0 0 6px } p { color:#b6c1ce }
    form { display:grid; gap:16px; margin-top:24px }
    label { display:grid; gap:6px; font-weight:600 }
    input,select,button { font:inherit; border-radius:8px; border:1px solid #485568; padding:11px 12px; color:inherit; background:#131922 }
    .actions { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px }
    button { cursor:pointer; border:0; background:#56c2a5; color:#09251e; font-weight:700 }
    button.secondary { background:#263647; color:#eef2f7; border:1px solid #485568 }
    button:disabled { opacity:.55; cursor:wait }
    #result { margin-top:24px; white-space:pre-wrap }
    .links { display:flex; flex-wrap:wrap; gap:12px }
    a { color:#78d7bd }
    video { width:100%; margin-top:16px; border-radius:10px; background:#050607 }
    small { color:#9da9b8 }
    .faces { display: flex; gap: 12px; flex-wrap: wrap; margin: 12px 0; }
    .face { border: 2px solid #ccc; border-radius: 8px; padding: 6px; cursor: pointer; text-align: center; max-width: 160px; }
    .face.selected { border-color: #2563eb; }
    .face img { width: 140px; height: 140px; object-fit: cover; border-radius: 6px; display: block; }
    .music-panel { margin: 12px 0; }
    .music-panel input[type=range] { width: 260px; vertical-align: middle; }
.custom-music { margin-top: 10px; }
.custom-music input, .custom-music small { display: block; margin: 6px 0; }
  </style>
</head>
<body>
<main>
  <h1>Directory Language Studio</h1>
  <p>Choose whether to run Masking, Dubbing, or Combine.</p>
  <form id="submit-form">
    <label>Video<input name="file" type="file" accept="video/mp4,video/quicktime,video/x-matroska,video/x-msvideo,video/webm" required></label>
    <label>Target language<select name="target_language" id="target" required></select></label>
    <label>Spoken source language code<input name="source_language" value="auto" placeholder="auto, en, hi…"></label>
    <small>Masking runs Service A. Dubbing runs Service B. Combine runs masking first, then dubbing, and produces one combined video.</small>
    <div class="actions">
      <button type="submit" name="operation" value="masking" class="secondary">Masking</button>
      <button type="submit" name="operation" value="dubbing" class="secondary">Dubbing</button>
      <button type="submit" name="operation" value="combine">Combine</button>
    </div>
  </form>
  <section id="result" aria-live="polite"></section>
</main>
<script>
const form = document.querySelector('#submit-form');
const result = document.querySelector('#result');
const buttons = [...form.querySelectorAll('button[type="submit"]')];
fetch('/api/languages').then(r => r.json()).then(items => {
  for (const item of items) {
    const option = document.createElement('option');
    option.value = item.code; option.textContent = `${item.name} (${item.code})`;
    document.querySelector('#target').append(option);
  }
});

async function renderFacePanel(jobId, resume) {
  const response = await fetch(`/api/jobs/${jobId}/faces`);
  const panel = document.createElement('section');
  if (!response.ok) { panel.textContent = 'Face choices are not ready yet…'; result.append(panel); setTimeout(resume, 2500); return; }
  const data = await response.json();
  const title = document.createElement('p');
  title.textContent = 'Which person should be lip-synced? Pick the speaker, then continue.';
  panel.append(title);
  const music = document.createElement('p');
  if (data.music && data.music.status === 'ok') music.textContent = `Music found: ${data.music.artist} – ${data.music.title}`;
  else music.textContent = 'Music not identified — the video will be voice-only.';
  panel.append(music);
  const row = document.createElement('div'); row.className = 'faces';
  let chosen = (data.candidates.find(c => c.recommended) || data.candidates[0]).id;
  for (const candidate of data.candidates) {
    const card = document.createElement('div'); card.className = 'face' + (candidate.id === chosen ? ' selected' : '');
    const image = document.createElement('img'); image.src = `/api/jobs/${jobId}/faces/${candidate.crop}`; image.alt = `Face ${candidate.id}`;
    const caption = document.createElement('small');
    caption.textContent = `${candidate.shots} shot(s) · ${Number(candidate.seconds).toFixed(1)}s${candidate.recommended ? ' · recommended' : ''}`;
    card.append(image, caption);
    card.addEventListener('click', () => {
      chosen = candidate.id;
      row.querySelectorAll('.face').forEach(el => el.classList.remove('selected'));
      card.classList.add('selected');
    });
    row.append(card);
  }
  panel.append(row);
  const confirm = document.createElement('button'); confirm.type = 'button'; confirm.textContent = 'Confirm & continue';
  const note = document.createElement('p');
  confirm.addEventListener('click', async () => {
    confirm.disabled = true;
    try {
      const reply = await fetch(`/api/jobs/${jobId}/face`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({candidate_id: chosen})});
      if (!reply.ok) { const err = await reply.json().catch(() => ({})); note.textContent = err.detail || 'Could not confirm the face.'; confirm.disabled = false; return; }
    } catch (error) { note.textContent = `Could not confirm the face: ${error.message}`; confirm.disabled = false; return; }
    resume();
  });
  panel.append(confirm, note);
  result.append(panel);
}

function errorText(body, fallback) {
  return body && typeof body.detail === 'string' ? body.detail : fallback;
}

function renderMusicPanel(jobId, job, video) {
  if (!job.music) return;
  const panel = document.createElement('div'); panel.className = 'music-panel';
  result.append(panel);
  const draw = music => {
    panel.replaceChildren();
    let slider = null;
    if (music.status === 'ok') {
      const label = document.createElement('p'); label.textContent = `Music: ${music.artist} – ${music.title}`;
      slider = document.createElement('input'); slider.type = 'range'; slider.min = 0; slider.max = 100;
      slider.value = music.percent ?? 25;
      const value = document.createElement('output'); value.textContent = `${slider.value}%`;
      slider.addEventListener('input', () => { value.textContent = `${slider.value}%`; });
      const apply = document.createElement('button'); apply.type = 'button'; apply.textContent = 'Apply';
      const status = document.createElement('small');
      apply.addEventListener('click', async () => {
        apply.disabled = true; status.textContent = 'Mixing…';
        try {
          const reply = await fetch(`/api/jobs/${jobId}/remix`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({music_percent: Number(slider.value)})});
          const body = await reply.json().catch(() => ({}));
          if (reply.ok) { video.src = `${body.final_video}?v=${Date.now()}`; video.load(); status.textContent = `Applied ${body.music_percent}%`; }
          else status.textContent = errorText(body, 'Mix failed');
        } catch (error) { status.textContent = `Mix failed: ${error.message}`; }
        apply.disabled = false;
      });
      panel.append(label, slider, value, apply, status);
    } else {
      const note = document.createElement('p');
      note.textContent = music.status === 'download_failed'
        ? `Music identified (${music.artist} – ${music.title}) but could not be downloaded — voice-only video.`
        : 'Music not identified — voice-only video.';
      panel.append(note);
    }
    panel.append(customMusicSection(jobId, music, video, () => slider ? Number(slider.value) : (music.percent ?? 25), draw));
  };
  draw(job.music);
}

function customMusicSection(jobId, music, video, currentPercent, redraw) {
  const section = document.createElement('details'); section.className = 'custom-music';
  const summary = document.createElement('summary'); summary.textContent = 'Use custom music instead';
  const fileInput = document.createElement('input'); fileInput.type = 'file';
  fileInput.accept = 'audio/*,.mp3,.wav,.m4a,.aac,.ogg,.flac';
  const urlInput = document.createElement('input'); urlInput.type = 'url'; urlInput.placeholder = '…or paste a YouTube link';
  const useButton = document.createElement('button'); useButton.type = 'button'; useButton.textContent = 'Use custom music';
  const status = document.createElement('small');
  useButton.addEventListener('click', async () => {
    const file = fileInput.files[0]; const link = urlInput.value.trim();
    if (Boolean(file) === Boolean(link)) { status.textContent = 'Choose an audio file or paste a YouTube link (one of the two).'; return; }
    const form = new FormData();
    if (file) form.append('file', file); else form.append('url', link);
    form.append('music_percent', String(currentPercent()));
    useButton.disabled = true; status.textContent = file ? 'Uploading and mixing…' : 'Downloading and mixing…';
    try {
      const reply = await fetch(`/api/jobs/${jobId}/music`, {method: 'POST', body: form});
      const body = await reply.json().catch(() => ({}));
      if (reply.ok) { video.src = `${body.final_video}?v=${Date.now()}`; video.load(); redraw(body.music); return; }
      status.textContent = errorText(body, 'Could not use that music');
    } catch (error) { status.textContent = `Could not use that music: ${error.message}`; }
    useButton.disabled = false;
  });
  const hint = document.createElement('small');
  hint.textContent = 'MP3, WAV, M4A, AAC, OGG or FLAC up to 50 MB, or a YouTube video up to 15 minutes. The music starts at 0:00 and is trimmed to the video length.';
  section.append(summary, fileInput, urlInput, useButton, hint, status);
  return section;
}

function startPolling(jobId) {
  buttons.forEach(button => button.disabled = true);
  const poll = async () => {
    let job;
    try {
      const statusResponse = await fetch(`/api/jobs/${encodeURIComponent(jobId)}`);
      if (!statusResponse.ok) { result.textContent = `Job ${jobId} was not found (it may have expired).`; buttons.forEach(button => button.disabled = false); return; }
      job = await statusResponse.json();
    } catch (error) { setTimeout(poll, 2500); return; }
    result.replaceChildren();
    const heading = document.createElement('p');
    heading.textContent = `${job.operation}: ${job.status} · ${job.stage}`;
    result.append(heading);
    const logLink = document.createElement('a'); logLink.href = job.log_url; logLink.textContent = 'View complete process log'; result.append(logLink);
    if (job.error) { const error = document.createElement('p'); error.textContent = job.error; result.append(error); }
    if (job.status === 'awaiting_face_selection') { await renderFacePanel(jobId, poll); return; }
    if (job.status === 'completed') {
      const links = document.createElement('div'); links.className = 'links';
      const labels = {final_video:'Processed video',visual_subtitles:'Visual subtitles',audio_subtitles:'Audio subtitles',masking_video:'Masking video',dubbed_video:'Dubbed video',service_a_video:'Service A video',service_b_video:'Service B video',service_b_audio:'Dubbed audio',voice_video:'Voice-only video',music_track:'Music track',music_info:'Music info'};
      for (const [name, url] of Object.entries(job.artifacts)) {
        const link = document.createElement('a'); link.href = url; link.textContent = labels[name] || name.replaceAll('_',' '); link.download = ''; links.append(link);
      }
      const manifest = document.createElement('a'); manifest.href = job.manifest_url; manifest.textContent = 'job manifest'; links.append(manifest);
      result.append(links);
      const video = document.createElement('video'); video.controls = true; video.src = job.artifacts.final_video; result.append(video);
      renderMusicPanel(jobId, job, video);
      buttons.forEach(button => button.disabled = false); return;
    }
    if (job.status === 'failed') { buttons.forEach(button => button.disabled = false); return; }
    setTimeout(poll, 2500);
  };
  poll();
}

form.addEventListener('submit', async event => {
  event.preventDefault();
  if (!form.reportValidity()) return;
  const operation = event.submitter?.value || 'combine';
  buttons.forEach(button => button.disabled = true);
  result.textContent = `Uploading video for ${operation}…`;
  try {
    const formData = new FormData(form);
    formData.set('operation', operation);
    const response = await fetch('/api/jobs', {method:'POST', body:formData});
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || 'Upload failed');
    result.textContent = `Job ${data.job_id}: queued`;
    startPolling(data.job_id);
    history.replaceState(null, '', '?job=' + encodeURIComponent(data.job_id));
  } catch (error) { result.textContent = error.message; buttons.forEach(button => button.disabled = false); }
});
const resumeJobId = new URLSearchParams(location.search).get('job');
if (resumeJobId) { result.textContent = `Resuming job ${resumeJobId}…`; startPolling(resumeJobId); }
</script>
</body>
</html>
